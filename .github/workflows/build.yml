# Build, test and release.
#
#   push / pull request   (not when only *.md files changed)
#                         build all packages (build.sh), run the unit tests,
#                         start every binary (MIPS and aarch64 under qemu)
#                         and the Windows package on real Windows; keep the
#                         packages as workflow artifacts
#   VERSION changed       push to main with a VERSION that has no tag
#                         v<VERSION> yet (or a push of that tag): the same,
#                         then publish the packages as GitHub Release
#                         v<VERSION> (the tag is created on the pushed commit)
#
# Packages (dist/):
#   internet-radio-proxifier-<V>-linux-x86_64.tar.gz     static (musl)
#   internet-radio-proxifier-<V>-linux-aarch64.tar.gz    static (musl)
#   internet-radio-proxifier-<V>-windows-x86_64.zip
#   internet-radio-proxifier-<V>-openwrt-<arch>.apk      OpenWrt 25.x
#   internet-radio-proxifier-<V>-openwrt-<arch>.ipk      OpenWrt 24.10
name: Build/release

on:
  push:
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

env:
  # The OpenWrt SDK (for its apk and fakeroot) and the MIPS toolchains
  OPENWRT_RELEASE: 25.12.5
  # its scripts/ipkg-build makes the ipk packages
  OPENWRT24_RELEASE: 24.10.8
  SDK_NAME: openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64
  # nightly for MIPS (-Z build-std); keep in step with build.sh
  NIGHTLY: nightly-2026-11-09

jobs:
  # release or not: VERSION without its tag on main, or the tag itself
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          V=$(tr -d ' \r\n' < VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          rel=false
          if [ "$GITHUB_REF" = "refs/tags/v$V" ]; then
            rel=true
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] &&
               ! git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            rel=true
          fi
          echo "release=$rel" >> "$GITHUB_OUTPUT"
          echo "VERSION $V, release: $rel"

  build:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64 \
            zip zstd curl
          # Ubuntu 26 has the qemu user binaries in qemu-user; older ones in qemu-user-static
          sudo apt-get install -y qemu-user || sudo apt-get install -y qemu-user-static
          rustup update stable
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-pc-windows-gnu
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src

      - name: Cache OpenWrt tools
        uses: actions/cache@v4
        with:
          path: |
            ~/openwrt-sdk-host
            ~/.cache/openwrt-toolchains
          key: openwrt-${{ env.OPENWRT_RELEASE }}-${{ env.OPENWRT24_RELEASE }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}-${{ env.NIGHTLY }}
          restore-keys: cargo-

      # only the host tools of the SDK are needed (apk, fakeroot)
      - name: OpenWrt SDK host tools
        run: |
          if [ ! -x ~/openwrt-sdk-host/$SDK_NAME/staging_dir/host/bin/apk ]; then
            mkdir -p ~/openwrt-sdk-host
            curl -sfL "https://downloads.openwrt.org/releases/$OPENWRT_RELEASE/targets/x86/64/$SDK_NAME.tar.zst" |
              tar --zstd -x -C ~/openwrt-sdk-host --wildcards "$SDK_NAME/staging_dir/host/*"
          fi
          echo "SDK=$HOME/openwrt-sdk-host/$SDK_NAME" >> "$GITHUB_ENV"

      - name: Unit tests
        run: cargo test --release --locked

      - name: Packages
        run: ./build.sh

      - name: Binaries start (version, player page, settings file)
        run: |
          V=$(tr -d ' \r\n' < VERSION)
          for t in x86_64-unknown-linux-musl:x86_64 aarch64-unknown-linux-musl:aarch64 \
                   mipsel-unknown-linux-musl:mipsel mips-unknown-linux-musl:mips; do
            b=target/${t%%:*}/release/radio
            q=$(command -v qemu-${t#*:} || command -v qemu-${t#*:}-static)
            file "$b"
            [ "$($q "$b" -V)" = "radio $V" ]
            rm -rf work && mkdir work
            $q "$b" -h 127.0.0.1:8123 -c work/settings.ini > work/run.log 2>&1 &
            pid=$!
            for i in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:8123/ && break; sleep 1; done
            curl -sf http://127.0.0.1:8123/ | grep -q 'Internet Radio'
            curl -sf http://127.0.0.1:8123/settings/api/stations | grep -q '"stations"'
            kill $pid; wait $pid || true
            grep -q '^\[' work/settings.ini
            echo "${t%%:*}: OK"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/*
          if-no-files-found: error

  windows-test:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist

      - name: Start radio.exe from the package
        shell: pwsh
        run: |
          Expand-Archive (Get-ChildItem dist/*-windows-x86_64.zip).FullName -DestinationPath pkg
          $dir = (Get-ChildItem pkg -Directory)[0].FullName
          Set-Location $dir
          & .\radio.exe -V
          $p = Start-Process .\radio.exe -ArgumentList '--host', ':8123', '--config', 'settings.ini' -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            try { $r = Invoke-WebRequest http://127.0.0.1:8123/ -UseBasicParsing; $ok = $r.Content -match 'Internet Radio' } catch { Start-Sleep 1 }
          }
          if (-not $ok) { Stop-Process $p; exit 1 }
          $s = Invoke-WebRequest http://127.0.0.1:8123/settings/api/stations -UseBasicParsing
          if ($s.Content -notmatch '"stations"') { Stop-Process $p; exit 1 }
          # an https station through the relay (bundled CA roots)
          $req = [System.Net.HttpWebRequest]::Create('http://127.0.0.1:8123/station/0')
          $req.Timeout = 20000
          $resp = $req.GetResponse()
          $buf = New-Object byte[] 65536
          $n = $resp.GetResponseStream().Read($buf, 0, $buf.Length)
          $resp.Close()
          Stop-Process $p
          if ($n -le 0) { exit 1 }
          if (-not (Test-Path settings.ini)) { exit 1 }
          "OK"

  release:
    if: >-
      !cancelled() && needs.version.outputs.release == 'true' &&
      needs.build.result == 'success' && needs.windows-test.result == 'success'
    needs: [version, build, windows-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist

      - name: Release text
        run: |
          cat > body.md <<'EOF'
          - **Linux** (`...-linux-x86_64.tar.gz`, `...-linux-aarch64.tar.gz`): static
            binaries, run `./radio -h :8123 -c settings.ini`
          - **Windows** (`...-windows-x86_64.zip`): run `start.cmd`
          - **OpenWrt 25.x** (`...-openwrt-<arch>.apk`): pick your router's package
            architecture (`cat /etc/apk/arch`), then
            `apk add --allow-untrusted internet-radio-proxifier-...-openwrt-<arch>.apk`
          - **OpenWrt 24.10** (`...-openwrt-<arch>.ipk`): architecture from
            `opkg print-architecture`, then
            `opkg install internet-radio-proxifier-...-openwrt-<arch>.ipk`

          Player: `http://<host>:8123/`, settings: `http://<host>:8123/settings`.
          EOF
          sed -i 's/^          //' body.md

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Internet Radio Proxifier ${{ needs.version.outputs.version }}
          generate_release_notes: true
          body_path: body.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
