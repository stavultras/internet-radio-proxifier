[package]
name = "radio"
# The release version is in the VERSION file (radio -V prints it).
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "LGPL-2.1-only"
description = "Web radio player that streams internet radio stations through the router"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "json"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-core = "0.3"

[target.'cfg(windows)'.dependencies]
webpki-roots = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
